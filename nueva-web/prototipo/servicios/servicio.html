<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Servicio · Órdago Films</title>
  <link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon-ordago.png?v=1">
  <link rel="stylesheet" href="../style.css?v=6">
  <link rel="stylesheet" href="../cine/cine.css?v=6">
  <link rel="stylesheet" href="../mobile.css?v=5">
  <script src="services.js?v=2" defer></script>
  <script src="service-page.js" defer></script>
  <script src="../deck-motion.js?v=4" defer></script>
  <script src="../decks.js?v=6" defer></script>
</head>
<body>
  <main class="service-page">
    <header class="service-header">
      <a class="cine-home" href="../index.html"><img src="../assets/logo.png" alt="Órdago Films, inicio"></a>
      <a href="index.html#portfolio">← Volver a Servicios</a>
    </header>
    <div class="service-heading"><h1>Servicio no disponible</h1><p hidden></p></div>
    <section class="service-deck" data-deck aria-label="Imágenes del servicio" hidden>
      <ul class="service-stills" id="service-gallery" data-deck-track tabindex="0" aria-label="Galería de imágenes"></ul>
      <div class="work-controls" role="group" aria-label="Recorrer imágenes">
        <button type="button" data-deck-step="-1" aria-controls="service-gallery" aria-label="Imagen anterior">←</button>
        <button type="button" data-deck-pause aria-label="Pausar desplazamiento" hidden>Ⅱ</button>
        <button type="button" data-deck-step="1" aria-controls="service-gallery" aria-label="Imagen siguiente">→</button>
      </div>
    </section>
    <a class="service-contact-link" href="index.html#contacto">Cuéntanos tu idea ↗</a>
  </main>
</body>
</html>
